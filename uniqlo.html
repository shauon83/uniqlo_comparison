<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNIQLO Price Compare</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Noto Sans KR', 'Noto Sans JP', system-ui, sans-serif; background: #f4f4f4; color: #111; }
  .jp { font-family: 'Noto Sans JP', sans-serif; }
  .red { color: #E60012; } .bg-red { background: #E60012; }
  .card { transition: opacity .25s ease, transform .25s ease; }
  .card.enter { opacity: 0; transform: translateY(6px); }
  .tab[aria-selected="true"] { border-color: #E60012; color: #111; font-weight: 700; }
</style>
</head>
<body>

<!-- Header -->
<header class="bg-white border-b border-neutral-200">
  <div class="max-w-7xl mx-auto px-4 py-5 flex flex-col md:flex-row md:items-end md:justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="bg-red text-white font-black leading-none text-[11px] w-12 h-12 grid place-content-center text-center tracking-tight select-none" aria-hidden="true">PRICE<br>CHECK</div>
      <div>
        <h1 class="text-2xl md:text-3xl font-black tracking-tight">UNIQLO Price Compare</h1>
        <p class="text-sm text-neutral-500">유니클로 한·일 가격 비교 &amp; 일본 한정 상품 · <span id="fetched-at"></span> 기준</p>
      </div>
    </div>
    <div class="flex flex-wrap items-center gap-2 self-start md:self-auto">
    <label class="flex items-center gap-2 text-sm bg-neutral-100 px-3 py-2">
      <i data-lucide="repeat" class="w-4 h-4 red"></i>
      <span class="font-medium">환율</span>
      <span class="text-neutral-500">100엔 =</span>
      <input id="rate" type="number" min="1" step="1" value="900" inputmode="numeric"
             class="w-24 border border-neutral-300 bg-white px-2 py-1 text-right font-bold focus:outline-none focus:border-[#E60012]" aria-label="100엔당 원화 환율">
      <span class="text-neutral-500">원</span>
    </label>
    <button id="cart-open" class="relative flex items-center gap-2 bg-black text-white text-sm font-bold px-3 py-2 hover:bg-[#E60012]" aria-label="장바구니 열기">
      <i data-lucide="shopping-bag" class="w-4 h-4"></i>장바구니
      <span id="cart-count" class="hidden bg-red text-white text-[11px] min-w-5 h-5 px-1 grid place-content-center rounded-full">0</span>
    </button>
    </div>
  </div>

  <!-- Summary counters -->
  <div class="max-w-7xl mx-auto px-4 pb-5 grid grid-cols-3 md:grid-cols-6 gap-2 md:gap-3">
    <div class="border-t-4 border-black bg-neutral-50 p-3">
      <p class="text-xs text-neutral-500">🇯🇵 일본 상품</p>
      <p class="text-xl md:text-2xl font-black" id="stat-jp">0</p>
    </div>
    <div class="border-t-4 border-black bg-neutral-50 p-3">
      <p class="text-xs text-neutral-500">🇰🇷 한국 상품</p>
      <p class="text-xl md:text-2xl font-black" id="stat-kr">0</p>
    </div>
    <div class="border-t-4 border-black bg-neutral-50 p-3">
      <p class="text-xs text-neutral-500">공통 (비교 가능)</p>
      <p class="text-xl md:text-2xl font-black" id="stat-count">0</p>
    </div>
    <div class="border-t-4 border-[#E60012] bg-neutral-50 p-3">
      <p class="text-xs text-neutral-500">일본 단독</p>
      <p class="text-xl md:text-2xl font-black" id="stat-excl">0</p>
    </div>
    <div class="border-t-4 border-neutral-400 bg-neutral-50 p-3">
      <p class="text-xs text-neutral-500">한국 단독</p>
      <p class="text-xl md:text-2xl font-black" id="stat-kr-only">0</p>
    </div>
    <div class="border-t-4 border-emerald-600 bg-neutral-50 p-3">
      <p class="text-xs text-neutral-500">공통품 일본 구매 시 평균 절약</p>
      <p class="text-xl md:text-2xl font-black" id="stat-save">0%</p>
    </div>
  </div>
</header>

<!-- Tabs & filters -->
<nav class="bg-white border-b border-neutral-200 sticky top-0 z-10">
  <div class="max-w-7xl mx-auto px-4 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3 py-2">
    <div class="flex overflow-x-auto -mb-px" role="tablist">
      <button class="tab whitespace-nowrap px-3 py-3 border-b-2 border-transparent text-sm text-neutral-500" role="tab" data-tab="all" aria-selected="true">📊 전체 비교</button>
      <button class="tab whitespace-nowrap px-3 py-3 border-b-2 border-transparent text-sm text-neutral-500" role="tab" data-tab="sale" aria-selected="false">🏷️ 할인 중인 상품만</button>
      <button class="tab whitespace-nowrap px-3 py-3 border-b-2 border-transparent text-sm text-neutral-500" role="tab" data-tab="excl" aria-selected="false">🇯🇵 일본 한정 상품</button>
    </div>
    <div class="flex flex-wrap gap-2 pb-2 lg:pb-0">
      <label class="relative flex-1 min-w-48 lg:w-56">
        <i data-lucide="search" class="w-4 h-4 absolute left-2 top-1/2 -translate-y-1/2 text-neutral-400"></i>
        <input id="q" type="search" placeholder="상품명·상품코드 검색 (한/日)" aria-label="상품명 검색"
               class="w-full border border-neutral-300 pl-8 pr-2 py-2 text-sm focus:outline-none focus:border-[#E60012]">
      </label>
      <select id="gender" aria-label="성별" class="border border-neutral-300 px-2 py-2 text-sm bg-white focus:outline-none focus:border-[#E60012]">
        <option value="">전체 성별</option>
      </select>
      <select id="cat" aria-label="카테고리" class="border border-neutral-300 px-2 py-2 text-sm bg-white focus:outline-none focus:border-[#E60012]">
        <option value="">전체 카테고리</option>
      </select>
      <select id="sort" aria-label="정렬" class="border border-neutral-300 px-2 py-2 text-sm bg-white focus:outline-none focus:border-[#E60012]">
        <option value="save">절약률 높은 순</option>
        <option value="reviews">리뷰 많은 순</option>
        <option value="price">일본가 낮은 순</option>
      </select>
    </div>
  </div>
</nav>

<main class="max-w-7xl mx-auto px-4 py-6">
  <div class="flex items-baseline justify-between mb-4">
    <h2 id="section-title" class="text-lg font-black"></h2>
    <p class="text-xs text-neutral-500"><span id="result-count">0</span>개</p>
  </div>
  <div id="grid" class="grid gap-4 grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></div>
  <p id="empty" class="hidden text-center text-neutral-500 py-16">조건에 맞는 상품이 없습니다.</p>
  <div class="text-center mt-6"><button id="more" class="hidden border border-black px-6 py-2 text-sm font-bold hover:bg-black hover:text-white"></button></div>
</main>

<!-- Cart drawer -->
<div id="cart" class="fixed inset-0 z-20 hidden" role="dialog" aria-modal="true" aria-labelledby="cart-title">
  <div class="absolute inset-0 bg-black/40" data-close></div>
  <aside class="absolute right-0 top-0 h-full w-full max-w-md bg-white flex flex-col shadow-xl">
    <div class="flex items-center justify-between border-b-4 border-black px-4 py-3">
      <h2 id="cart-title" class="text-lg font-black">구매 리스트</h2>
      <button data-close class="text-2xl leading-none px-2" aria-label="닫기">×</button>
    </div>
    <ul id="cart-items" class="flex-1 overflow-y-auto divide-y divide-neutral-200 px-4"></ul>
    <div id="cart-summary" class="border-t border-neutral-200 bg-neutral-50 px-4 py-3 text-sm space-y-1"></div>
    <div class="grid grid-cols-3 gap-2 p-4 text-xs font-bold">
      <button id="cart-save" class="bg-black text-white py-2 hover:bg-[#E60012]">파일로 저장</button>
      <label class="border border-black text-center py-2 cursor-pointer hover:bg-neutral-100">불러오기
        <input id="cart-load" type="file" accept=".json,application/json" class="sr-only">
      </label>
      <button id="cart-clear" class="border border-neutral-300 text-neutral-500 py-2 hover:border-black">비우기</button>
    </div>
  </aside>
</div>

<footer class="text-center text-xs text-neutral-400 py-8 px-4">
  비공식 비교 도구입니다. 데이터는 uniqlo.com 일본·한국 온라인스토어에서 <span id="fetched-at-2"></span>에 수집했으며, 이후 가격·재고가 바뀌었을 수 있습니다.
  최신화: <code>python fetch_uniqlo.py</code>
</footer>

const pctOff = (base, sale) => Math.round((1 - sale / base) * 100);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// JPY sale price converted to KRW vs KR sale price; positive diff = Japan cheaper.
function compare(p, rate) {
  const jpKrw = p.jp_sale_price * rate / 100;
  const diff = p.kr_sale_price - jpKrw;
  return { jpKrw, diff, pct: diff / p.kr_sale_price * 100 };
}
console.assert(compare({ jp_sale_price: 1000, kr_sale_price: 10000 }, 900).diff === 1000, "compare self-check");

// The store APIs expose only the current price (no original), so discounts come from the price flags.
const SALE_FLAG = /値下げ|期間限定|가격인하|기간한정/;
const saleFlags = (flags) => (flags || []).filter((f) => SALE_FLAG.test(f));
const isSale = (p) => saleFlags(p.jp_flags).length > 0 || saleFlags(p.kr_flags).length > 0
  || p.jp_sale_price < p.jp_price || (p.kr_sale_price != null && p.kr_sale_price < p.kr_price);
const fallbackImg = (label) => "data:image/svg+xml," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400"><rect width="300" height="400" fill="#e5e5e5"/><text x="150" y="205" font-family="sans-serif" font-size="22" font-weight="700" fill="#9a9a9a" text-anchor="middle">${esc(label)}</text></svg>`);

function priceRow(flag, label, base, sale, fmt, flags) {
  const cut = sale < base;
  const sf = saleFlags(flags);
  const onSale = cut || sf.length > 0;
  return `<div class="flex items-start justify-between gap-2">
    <span class="text-xs text-neutral-500 pt-0.5 whitespace-nowrap">${flag} ${label}</span>
    <span class="text-right">
      ${onSale ? `<span class="bg-red text-white text-[10px] font-bold px-1 mr-1 align-middle">SALE${cut ? ` -${pctOff(base, sale)}%` : ""}</span>` : ""}
      ${cut ? `<s class="text-xs text-neutral-400">${fmt(base)}</s><br>` : ""}
      <b class="${onSale ? "red" : ""}">${fmt(sale)}</b>
      ${sf.length ? `<br><span class="text-[10px] red">${sf.map(esc).join(" · ")}</span>` : ""}
    </span>
  </div>`;
}

function imgBlock(p, badge) {
  return `<div class="relative aspect-[3/4] bg-neutral-200 overflow-hidden">
    <img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" class="w-full h-full object-cover"
         onerror="this.onerror=null;this.src='${fallbackImg(p.category)}'">
    <span class="absolute top-2 left-2 bg-white/90 text-[10px] font-bold px-1.5 py-0.5">${esc(GENDER_KR[p.gender] || p.gender)} · ${esc(p.category)}</span>
    ${badge}
  </div>`;
}

const meta = (p) => `<p class="text-[11px] text-neutral-400">${esc(p.id)}${p.match === "reviewed" ? ` <span title="한국 코드 ${esc(p.kr_id)} · 이름 번역·사진으로 같은 상품 확인">(KR 코드 상이)</span>` : ""}${p.reviews ? ` · ★${p.rating} (${p.reviews.toLocaleString()})` : ""}</p>`;
const link = (href, text, cls = "") => `<a href="${esc(href)}" target="_blank" rel="noopener" class="${cls} text-center border border-neutral-300 py-1.5 hover:border-black">${text}</a>`;

// ---- Virtual cart: id -> qty. Persisted only via JSON file save/load.
const cart = new Map();
const byId = Object.fromEntries(PRODUCTS.map((p) => [p.id, p]));
const MAX_QTY = 99;

function addBtn(p) {
  const q = cart.get(p.id);
  const id = esc(p.id);
  if (!q) return `<button data-add="${id}" class="text-xs font-bold py-2 bg-black text-white hover:bg-[#E60012]">+ 장바구니 담기</button>`;
  return `<div class="flex text-xs font-bold bg-red text-white">
    <button data-sub="${id}" class="px-3 py-2 hover:bg-black" aria-label="하나 빼기">−</button>
    <span class="flex-1 text-center py-2">✓ 담김 ${q}개</span>
    <button data-add="${id}" class="px-3 py-2 hover:bg-black" aria-label="하나 더 담기">+</button>
    <button data-del="${id}" class="px-2 py-2 border-l border-white/40 hover:bg-black" aria-label="장바구니에서 제외">제외</button>
  </div>`;
}

function setQty(id, qty) {
  qty > 0 ? cart.set(id, Math.min(qty, MAX_QTY)) : cart.delete(id);
  render();
}

// Validates an untrusted saved file; only ids known to PRODUCTS are kept.
function parseCart(text) {
  const data = JSON.parse(text);
  if (!data || !Array.isArray(data.items)) throw new Error("구매 리스트 파일 형식이 아닙니다.");
  const items = new Map();
  let skipped = 0;
  for (const it of data.items) {
    const qty = Number(it && it.qty);
    if (it && Object.hasOwn(byId, it.id) && Number.isInteger(qty) && qty > 0)
      items.set(it.id, Math.min((items.get(it.id) || 0) + qty, MAX_QTY));
    else skipped++;
  }
  return { items, skipped };
}
(() => {
  const id = PRODUCTS[0]?.id;
  if (!id) return;
  const r = parseCart(JSON.stringify({ items: [{ id, qty: 2 }, { id: "nope", qty: 1 }, { id, qty: -1 }] }));
  console.assert(r.items.get(id) === 2 && r.items.size === 1 && r.skipped === 2, "parseCart self-check");
})();

function saveCart() {
  if (!cart.size) return alert("장바구니가 비어 있습니다.");
  const saved_at = new Date().toISOString();
  const data = {
    app: "uniqlo-price-compare", version: 2, saved_at, data_fetched_at: FETCHED_AT, rate_krw_per_100jpy: state.rate,
    items: [...cart].map(([id, qty]) => ({ id, name: byId[id].name, qty })),
  };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
  a.download = `uniqlo-cart-${saved_at.slice(0, 10)}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function loadCart(file) {
  try {
    const { items, skipped } = parseCart(await file.text());
    if (!items.size) throw new Error("불러올 수 있는 상품이 없습니다. (현재 판매 목록에 없는 상품일 수 있습니다)");
    if (cart.size && !confirm("현재 장바구니를 불러온 리스트로 바꿀까요?")) return;
    cart.clear();
    items.forEach((q, id) => cart.set(id, q));
    render();
    if (skipped) alert(`${skipped}개 항목은 현재 판매 목록에 없거나 수량이 잘못되어 제외했습니다.`);
  } catch (e) {
    alert("불러오기 실패: " + (e instanceof SyntaxError ? "JSON 파일이 아닙니다." : e.message));
  }
}

function renderCart() {
  const lines = [...cart].map(([id, qty]) => ({ p: byId[id], qty }));
  const count = lines.reduce((s, l) => s + l.qty, 0);
  $("#cart-count").textContent = count;
  $("#cart-count").classList.toggle("hidden", !count);

  $("#cart-items").innerHTML = lines.length ? lines.map(({ p, qty }) => `
    <li class="py-3 flex gap-3">
      <img src="${esc(p.image)}" alt="" class="w-16 h-20 object-cover bg-neutral-200 shrink-0" onerror="this.onerror=null;this.src='${fallbackImg(p.category)}'">
      <div class="flex-1 min-w-0 text-sm">
        <p class="font-bold leading-snug truncate">${esc(p.name)}</p>
        <p class="text-xs text-neutral-500">${yen(p.jp_sale_price * qty)} ≈ ${won(p.jp_sale_price * qty * state.rate / 100)}
          · ${p.kr_sale_price ? "KR " + won(p.kr_sale_price * qty) : "한국 미판매"}</p>
        <div class="mt-1 flex items-center gap-1">
          <button data-qty="${esc(p.id)}" data-d="-1" class="w-7 h-7 border border-neutral-300" aria-label="수량 줄이기">−</button>
          <span class="w-8 text-center font-bold">${qty}</span>
          <button data-qty="${esc(p.id)}" data-d="1" class="w-7 h-7 border border-neutral-300" aria-label="수량 늘리기">+</button>
          <button data-qty="${esc(p.id)}" data-d="-${MAX_QTY}" class="ml-auto text-xs text-neutral-400 hover:text-[#E60012]">삭제</button>
        </div>
      </div>
    </li>`).join("") : `<li class="py-16 text-center text-sm text-neutral-500">담긴 상품이 없습니다.</li>`;

  const sum = (arr, f) => arr.reduce((s, l) => s + f(l.p) * l.qty, 0);
  const same = lines.filter((l) => l.p.kr_sale_price > 0);
  const excl = lines.filter((l) => !(l.p.kr_sale_price > 0));
  const jpYen = sum(lines, (p) => p.jp_sale_price);
  const sameJpKrw = sum(same, (p) => p.jp_sale_price) * state.rate / 100;
  const sameKr = sum(same, (p) => p.kr_sale_price);
  const save = sameKr - sameJpKrw;
  const row = (k, v, cls = "") => `<div class="flex justify-between gap-2 ${cls}"><span class="text-neutral-500">${k}</span><b class="text-right">${v}</b></div>`;
  $("#cart-summary").innerHTML = !lines.length ? row("합계", "₩0") : [
    row("일본 결제 합계", `${yen(jpYen)} ≈ ${won(jpYen * state.rate / 100)}`, "text-base"),
    same.length ? row(`동일 상품 ${same.length}종 한국 구매 시`, won(sameKr)) : "",
    same.length ? row("동일 상품 기준 일본 구매 시", save >= 0
      ? `<span class="text-emerald-600">${won(save)} 절약 (${(save / sameKr * 100).toFixed(1)}%)</span>`
      : `<span class="red">${won(-save)} 더 비쌈</span>`) : "",
    excl.length ? row(`일본 한정 ${excl.length}종 (비교 제외)`, won(sum(excl, (p) => p.jp_sale_price) * state.rate / 100)) : "",
  ].join("");
}

const openCart = (open) => { $("#cart").classList.toggle("hidden", !open); document.body.style.overflow = open ? "hidden" : ""; };

function compareCard(p) {
  const { jpKrw, diff, pct } = compare(p, state.rate);
  const verdict = Math.abs(diff) < 1
    ? `<span class="bg-neutral-200 text-neutral-700">가격 동일</span>`
    : diff > 0
      ? `<span class="bg-emerald-600 text-white">🇯🇵 일본이 ${won(diff)} 더 저렴 (${pct.toFixed(1)}% 절약)</span>`
      : `<span class="bg-red text-white">🇰🇷 한국이 ${won(-diff)} 더 저렴 (${(-pct).toFixed(1)}%)</span>`;
  return `<article class="card enter bg-white flex flex-col">
    ${imgBlock(p, isSale(p) ? `<span class="absolute top-2 right-2 bg-red text-white text-[10px] font-bold px-1.5 py-0.5">SALE</span>` : "")}
    <div class="p-3 md:p-4 flex flex-col gap-3 flex-1">
      <div>
        <h3 class="font-bold leading-snug text-sm md:text-base">${esc(p.name_kr)}</h3>
        <p class="jp text-xs text-neutral-500">${esc(p.name_jp)}</p>
        ${meta(p)}
      </div>
      <div class="border-t border-neutral-200 pt-3 space-y-2 text-sm">
        ${priceRow("🇯🇵", "일본", p.jp_price, p.jp_sale_price, yen, p.jp_flags)}
        ${priceRow("🇰🇷", "한국", p.kr_price, p.kr_sale_price, won, p.kr_flags)}
      </div>
      <div class="bg-neutral-50 p-2 text-xs space-y-1">
        <div class="flex justify-between gap-2"><span class="text-neutral-500">일본가 원화 환산</span><b>${won(jpKrw)}</b></div>
        <div class="flex justify-between gap-2"><span class="text-neutral-500">한국 판매가</span><b>${won(p.kr_sale_price)}</b></div>
      </div>
      <div class="mt-auto text-xs font-bold [&>span]:block [&>span]:px-2 [&>span]:py-1.5 [&>span]:text-center">${verdict}</div>
      ${addBtn(p)}
      <div class="flex gap-2 text-xs">${link(p.jp_link, "JP 스토어", "flex-1")}${link(p.kr_link, "KR 스토어", "flex-1")}</div>
    </div>
  </article>`;
}

function exclusiveCard(p) {
  return `<article class="card enter bg-white flex flex-col">
    ${imgBlock(p, `<span class="absolute top-2 right-2 bg-red text-white text-[10px] font-bold px-1.5 py-0.5">🇯🇵 일본 한정</span>`)}
    <div class="p-3 md:p-4 flex flex-col gap-3 flex-1">
      <div>
        <h3 class="jp font-bold leading-snug text-sm md:text-base">${esc(p.name_jp)}</h3>
        ${meta(p)}
      </div>
      <div class="flex flex-wrap gap-1">${[p.category, ...(p.jp_flags || []).filter((f) => !SALE_FLAG.test(f))].map((t) => `<span class="text-[11px] border border-neutral-300 px-1.5 py-0.5 jp">#${esc(t)}</span>`).join("")}</div>
      <div class="border-t border-neutral-200 pt-3 space-y-2 text-sm">
        ${priceRow("🇯🇵", "일본", p.jp_price, p.jp_sale_price, yen, p.jp_flags)}
        <div class="flex justify-between gap-2"><span class="text-xs text-neutral-500">원화 환산</span><b>≈ ${won(p.jp_sale_price * state.rate / 100)}</b></div>
      </div>
      <p class="mt-auto text-xs text-neutral-500 bg-neutral-50 p-2">한국 온라인스토어에서 같은 상품코드 없음 · 일본 구매 필요</p>
      ${addBtn(p)}
      ${link(p.jp_link, "JP 스토어", "text-xs")}
    </div>
  </article>`;
}

const SORTS = {
  save: (a, b) => (b.kr_sale_price ? compare(b, state.rate).pct : -1e9) - (a.kr_sale_price ? compare(a, state.rate).pct : -1e9) || (b.reviews || 0) - (a.reviews || 0),
  reviews: (a, b) => (b.reviews || 0) - (a.reviews || 0),
  price: (a, b) => a.jp_sale_price - b.jp_sale_price,
};

function render() {
  // Summary counters always reflect the full dataset.
  $("#stat-jp").textContent = STATS.jp.toLocaleString();
  $("#stat-kr").textContent = STATS.kr.toLocaleString();
  $("#stat-kr-only").textContent = STATS.kr_only.toLocaleString();
  $("#stat-count").textContent = COMPARABLE.length.toLocaleString();
  $("#stat-excl").textContent = EXCLUSIVE.length.toLocaleString();
  const avg = COMPARABLE.length ? COMPARABLE.reduce((s, p) => s + compare(p, state.rate).pct, 0) / COMPARABLE.length : 0;
  $("#stat-save").textContent = (avg >= 0 ? "" : "+") + Math.abs(avg).toFixed(1) + "%";
  $("#stat-save").className = "text-xl md:text-2xl font-black " + (avg >= 0 ? "text-emerald-600" : "red");

  const base = state.tab === "excl" ? EXCLUSIVE : state.tab === "sale" ? COMPARABLE.filter(isSale) : COMPARABLE;
  const q = state.q.trim().toLowerCase();
  const list = base.filter((p) =>
    (!state.cat || p.category === state.cat) &&
    (!state.gender || p.gender === state.gender) &&
    (!q || (p.name_kr + " " + p.name_jp + " " + p.id).toLowerCase().includes(q)))
    .sort(SORTS[state.sort]);
  const shown = list.slice(0, state.limit);

  $("#section-title").textContent = { all: "동일 상품 가격 비교", sale: "할인 중인 상품", excl: "일본 한정 상품" }[state.tab];
  $("#result-count").textContent = list.length.toLocaleString();
  $("#empty").classList.toggle("hidden", list.length > 0);
  $("#grid").innerHTML = shown.map(state.tab === "excl" ? exclusiveCard : compareCard).join("");
  $("#more").classList.toggle("hidden", shown.length >= list.length);
  $("#more").textContent = `더 보기 (${(list.length - shown.length).toLocaleString()}개 남음)`;
  requestAnimationFrame(() => document.querySelectorAll(".card.enter").forEach((el) => el.classList.remove("enter")));
  renderCart();
}

// Filter changes start from the first page again.
const refilter = (key) => (e) => { state[key] = e.target.value; state.limit = PAGE; render(); };

$("#grid").addEventListener("click", (e) => {
  const b = e.target.closest("[data-add],[data-sub],[data-del]");
  if (!b) return;
  const { add, sub, del } = b.dataset;
  if (add) setQty(add, (cart.get(add) || 0) + 1);
  else if (sub) setQty(sub, (cart.get(sub) || 0) - 1);
  else setQty(del, 0);
});
$("#cart-items").addEventListener("click", (e) => {
  const b = e.target.closest("[data-qty]");
  if (b) setQty(b.dataset.qty, (cart.get(b.dataset.qty) || 0) + Number(b.dataset.d));
});
$("#cart-open").addEventListener("click", () => openCart(true));
$("#cart").addEventListener("click", (e) => { if (e.target.closest("[data-close]")) openCart(false); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") openCart(false); });
$("#cart-save").addEventListener("click", saveCart);
$("#cart-load").addEventListener("change", (e) => { const f = e.target.files[0]; if (f) loadCart(f); e.target.value = ""; });
$("#cart-clear").addEventListener("click", () => { if (cart.size && confirm("장바구니를 비울까요?")) { cart.clear(); render(); } });
$("#more").addEventListener("click", () => { state.limit += PAGE; render(); });

$("#rate").addEventListener("input", (e) => {
  const v = parseFloat(e.target.value);
  if (v > 0) { state.rate = v; render(); }
});
$("#q").addEventListener("input", refilter("q"));
$("#cat").addEventListener("change", refilter("cat"));
$("#gender").addEventListener("change", refilter("gender"));
$("#sort").addEventListener("change", refilter("sort"));
document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => {
  state.tab = b.dataset.tab;
  state.limit = PAGE;
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", t === b));
  render();
}));

$("#fetched-at").textContent = $("#fetched-at-2").textContent = FETCHED_AT || "데이터 없음";
$("#cat").insertAdjacentHTML("beforeend", CATEGORIES.map((c) => `<option>${esc(c)}</option>`).join(""));
$("#gender").insertAdjacentHTML("beforeend", GENDERS.map((g) => `<option value="${esc(g)}">${esc(GENDER_KR[g] || g)}</option>`).join(""));
render();
window.lucide && lucide.createIcons();
</script>
</body>
</html>
